name: Deploy producao

# Push na main => imagem nova no ghcr.io => VPS atualizada.
# Para publicar, basta fazer merge da branch de trabalho na main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dois deploys ao mesmo tempo no mesmo servidor.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  testes:
    name: Testes do backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        working-directory: back
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pytest

      # Apenas os testes de regra de negocio: os de avaliacao dependem do
      # pacote de metricas (requirements-eval.txt) e de chaves de API.
      - name: Rodar testes
        working-directory: back
        run: |
          pytest -q \
            tests/test_helpers.py \
            tests/test_intents.py \
            tests/test_chat_service_rules.py \
            tests/test_student_list.py

  build:
    name: Build e publicacao da imagem
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Cache entre execucoes: sem isso cada deploy recompila
          # node_modules e as dependencias Python do zero.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Atualizar a VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Puxar a imagem nova e reiniciar
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -e
             cd /opt/titasbot
             docker compose pull
             docker compose up -d
             docker image prune -f'

      # Consulta o /health dentro do proprio container: pelo Caddy, um
      # SITE_ADDRESS com dominio responderia redirecionamento para HTTPS e o
      # teste passaria sem nunca tocar a aplicacao.
      - name: Conferir /health
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/titasbot
             for i in $(seq 1 30); do
               if docker compose exec -T app python -c \
                   "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=5)" \
                   >/dev/null 2>&1; then
                 echo "OK: aplicacao respondendo"; exit 0
               fi
               sleep 10
             done
             echo "A aplicacao nao respondeu em /health" >&2
             docker compose logs --tail 60 app >&2
             exit 1'
